[project]
name = "supreme-ai"
version = "0.0.1"
description = "Supreme on-box AI assistant (local model host) — §10."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
# The on-box LLM runtime. Optional so base install + tests need no model/weights;
# enable on the appliance with `pip install '.[llm]'` and provision a GGUF via
# SUPREME_AI_MODEL_PATH (see scripts/dev/fetch-ai-model.sh).
llm = ["llama-cpp-python>=0.3.0"]

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.27.0", "ruff>=0.7.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
