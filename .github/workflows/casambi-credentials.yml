name: Render Casambi fleet credentials

# § Casambi fleet-wide env-var default — the ONE place a human ever types the real Casambi
# Cloud fleet account (API key + network admin email/password) is this workflow's own
# GitHub Actions repository secrets (Settings -> Secrets and variables -> Actions:
# CASAMBI_API_KEY, CASAMBI_EMAIL, CASAMBI_PASSWORD), added once, by an admin, directly in
# GitHub's own encrypted secrets UI — never a file in this repo, never pasted into a chat,
# never present in a diff or `git log`.
#
# Every time a new hub (or an existing one rotating the password) needs the credentials
# file, trigger this workflow (Actions tab -> this workflow -> "Run workflow") and
# download its output artifact — no retyping the actual values, ever, after the one-time
# secret setup. Copy the downloaded file to /etc/supremeos/casambi-fleet-credentials on
# that machine (mode 0600), then run install.sh (new hub) or
# infra/native-linux/apply-casambi-credentials.sh (already-installed hub) — see that
# script and infra/native-linux/config/casambi-fleet-credentials.example for the full
# picture.
#
# Deliberately workflow_dispatch-only — this never runs automatically on a push or tag,
# only when someone with repo write access explicitly asks for a freshly rendered file.
# The output artifact has a short retention (1 day) and is never attached to a published
# GitHub Release (unlike release.yml's install artifact, which every repo collaborator or
# the public — depending on repo visibility — can download indefinitely) — this is a
# narrowly-scoped, self-expiring provisioning aid, not something meant to persist or ship
# to end users. SUPREME_CASAMBI_NETWORK_ID is left blank in the rendered file on purpose —
# unlike the account itself, it identifies which Casambi network THIS specific hub's
# fixtures live in, which genuinely varies per installation, so it isn't a fleet secret to
# store here at all.

on:
  workflow_dispatch: {}

jobs:
  check-secrets:
    name: Confirm secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          api_key="${{ secrets.CASAMBI_API_KEY != '' }}"
          email="${{ secrets.CASAMBI_EMAIL != '' }}"
          password="${{ secrets.CASAMBI_PASSWORD != '' }}"
          if [ "$api_key" = "true" ] && [ "$email" = "true" ] && [ "$password" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  fail-if-not-configured:
    name: Secrets not configured
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.configured != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::CASAMBI_API_KEY / CASAMBI_EMAIL / CASAMBI_PASSWORD are not all set as repository secrets (Settings -> Secrets and variables -> Actions). Add all three once, then re-run this workflow."
          exit 1

  render:
    name: Render credentials file
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Values only ever exist as this step's own env vars (never inlined into a `run:`
      # string, never echoed as a bare argument) — GitHub's runner masks secret values in
      # logs automatically, but keeping them in env: rather than the script body is the
      # standard extra precaution against a value ever being reconstructable from a log
      # line even partially.
      - name: Render
        env:
          SUPREME_CASAMBI_API_KEY: ${{ secrets.CASAMBI_API_KEY }}
          SUPREME_CASAMBI_EMAIL: ${{ secrets.CASAMBI_EMAIL }}
          SUPREME_CASAMBI_PASSWORD: ${{ secrets.CASAMBI_PASSWORD }}
        run: |
          mkdir -p out
          {
            echo "# SupremeOS — Casambi fleet credentials, rendered $(date -u +%Y-%m-%dT%H:%M:%SZ) by"
            echo "# GitHub Actions workflow_dispatch. Copy to /etc/supremeos/casambi-fleet-credentials"
            echo "# on the target hub (chmod 0600), then run install.sh or apply-casambi-credentials.sh."
            echo "# Fill in SUPREME_CASAMBI_NETWORK_ID below only if this specific hub needs to pin one."
            echo "SUPREME_CASAMBI_API_KEY=\"${SUPREME_CASAMBI_API_KEY}\""
            echo "SUPREME_CASAMBI_EMAIL=\"${SUPREME_CASAMBI_EMAIL}\""
            echo "SUPREME_CASAMBI_PASSWORD=\"${SUPREME_CASAMBI_PASSWORD}\""
            echo "SUPREME_CASAMBI_NETWORK_ID=\"\""
          } > out/casambi-fleet-credentials
          chmod 600 out/casambi-fleet-credentials
      - uses: actions/upload-artifact@v4
        with:
          name: casambi-fleet-credentials
          path: out/casambi-fleet-credentials
          retention-days: 1
