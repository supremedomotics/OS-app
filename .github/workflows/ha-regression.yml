name: HA upgrade regression

# The blueprint's #1 risk: a Home Assistant upgrade breaking the SIL. This runs the
# gated live-HA SIL suite against a MATRIX of HA versions — running the same suite
# across version N and N+1 is the upgrade gate. Headless: HA is onboarded via its
# REST flow (scripts/dev/ha-onboard.sh), so no manual clicks. Manual + weekly.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated HA versions (informational; edit the matrix to change)"
        required: false
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  ha-regression:
    name: SIL vs HA ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned version + the next one(s): the upgrade gate. Bump as HA releases.
        ha: ["2024.12", "2025.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false

      - name: Start Home Assistant ${{ matrix.ha }}
        run: |
          docker run -d --name ha -p 8123:8123 "homeassistant/home-assistant:${{ matrix.ha }}"

      - name: Headless onboarding → token
        id: ha
        run: |
          TOKEN=$(HA_URL=http://127.0.0.1:8123 bash scripts/dev/ha-onboard.sh)
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run the gated SIL suite against real HA
        env:
          SUPREME_HA_TEST_URL: ws://127.0.0.1:8123/api/websocket
          SUPREME_HA_TEST_TOKEN: ${{ steps.ha.outputs.token }}
        run: pnpm --filter @supreme/integration-layer test

      - name: HA logs on failure
        if: failure()
        run: docker logs ha | tail -100
