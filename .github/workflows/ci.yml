name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TS workspace (build · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  flutter:
    name: Flutter analyze · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
      - name: Analyze + test packages
        run: |
          for pkg in packages/aureon-flutter packages/supreme-sdk-dart apps/mobile; do
            echo "::group::$pkg"
            (cd "$pkg" && flutter pub get && (flutter analyze || dart analyze))
            echo "::endgroup::"
          done
      - name: Widget tests (mobile)
        run: cd apps/mobile && flutter test
      - name: Build web bundle (compile proof)
        run: cd apps/mobile && flutter build web --no-tree-shake-icons

  python:
    name: Python commissioning (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/commissioning-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi "uvicorn[standard]" pydantic pytest httpx ruff
      - run: ruff check .
      - run: pytest -q
