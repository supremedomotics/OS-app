# Standalone Home Assistant for INTEGRATION TESTING only (readiness §2).
#
# Unlike the production hub (where HA is headless + unpublished), this harness
# publishes HA on localhost:8123 so the gated live-HA test can reach it. Do NOT use
# in production.
#
#   docker compose -f infra/hub-compose/docker-compose.ha-test.yml up -d
#   # open http://127.0.0.1:8123, complete onboarding, create a long-lived token
#   SUPREME_HA_TEST_URL=ws://127.0.0.1:8123/api/websocket \
#   SUPREME_HA_TEST_TOKEN=<token> \
#     pnpm --filter @supreme/integration-layer test
name: supreme-ha-test

services:
  homeassistant:
    image: homeassistant/home-assistant:2024.12
    ports:
      - "8123:8123"
    volumes:
      - ha-test-config:/config
    restart: unless-stopped

volumes:
  ha-test-config:
