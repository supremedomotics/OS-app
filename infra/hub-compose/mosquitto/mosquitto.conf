# Mosquitto broker for the hub's MQTT device bus (blueprint §2.1, §14).
# Internal plane only — not published to the host; isolated via the `supreme-core` internal
# Docker network, same as redis/nats in this compose file. No client in this codebase
# authenticates to MQTT (SUPREME_MQTT_URL carries no credentials) — password_file was
# declared but never wired to a passwd file or any client, which made the broker fail to
# start at all (missing password_file => Mosquitto exits at listener bind, restart loop).
# Anonymous access here matches the redis/nats pattern: network isolation is the boundary,
# not per-service auth, for internal-only buses with no external client wiring.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
