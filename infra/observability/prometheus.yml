# Prometheus scrape config for Supreme OS (§6). Scrapes the gateway's /metrics (and the
# cloud relay/fleet where exposed). /metrics stays on the internal network — never the
# public edge. Adjust targets to your hub fleet / service discovery.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: supreme-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels: { service: gateway }

  - job_name: supreme-relay
    metrics_path: /metrics
    static_configs:
      - targets: ["relay:8090"]
        labels: { service: relay }
