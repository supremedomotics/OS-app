name: supreme_flutter
repository: https://github.com/supremedomotics/os-app

# Melos manages the Dart/Flutter workspace (apps + Flutter packages), parallel to
# the pnpm/Turborepo workspace that manages the JS/TS + Python sides (§4).
packages:
  - apps/mobile
  # apps/installer — form factor (Flutter vs web) is a deferred open item (§4 / open #2)
  - packages/aureon-flutter
  - packages/supreme-sdk-dart
  # apps/new/* — new-generation SupremeOS UI (mobile + touch panel), built from
  # scratch per the residence-first architecture; independent of apps/mobile.
  - apps/new/shared
  - apps/new/shared_ui
  - apps/new/mobile
  - apps/new/touchpanel

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: Analyze all Dart packages.
    run: melos exec -- dart analyze .
  test:
    description: Run all Flutter/Dart tests.
    run: melos exec -- flutter test
  format:
    description: Format all Dart code.
    run: melos exec -- dart format .
