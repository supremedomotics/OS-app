name: supreme_mobile
description: Supreme OS homeowner app (Flutter) — room-first, gesture-driven, Aureon.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  video_player: ^2.9.2
  flutter_webrtc: ^0.12.5
  http: ^1.2.2
  aureon_flutter:
    path: ../../packages/aureon-flutter
  supreme_sdk:
    path: ../../packages/supreme-sdk-dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
