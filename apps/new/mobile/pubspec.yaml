name: supreme_mobile_next
description: >
  SupremeOS Mobile — new UI/UX foundation (apps/new). Independent from
  apps/mobile; built from scratch per the residence-first navigation model
  (Home / Spaces / Experiences / Now / More).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supreme_os_core:
    path: ../shared
  supreme_os_ui:
    path: ../shared_ui
  shared_preferences: ^2.5.5
  http: ^1.6.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
